# Con Edison statements (PSC No. 10) that sit on top of tariff delivery rates and MSC prices.
# Source: https://dps.ny.gov/electric-tariffs -> Con Edison -> Statements (effective + cancelled lists).
# To update: ADD entries (effective date, value, stmt = statement number); never edit old ones.
#
# Units: $/kWh unless the series says otherwise; unit = "percent" for the tax series.
# NOTE: statements filed before Feb 2026 print amounts in CENTS per kWh; the values here are converted to
# dollars, with the printed cents in the comment. Use the monthly-bill column, not the bi-monthly one.
#
# `rule` says which value applies to a bill (verified against six SC 1 Rate I bills, see SPEC.md):
#   to_date      - the value in effect on the bill's TO date. The tariff states this for AF-MSC
#                  (GR 25.2.4) and AF-MAC (GR 26.1.3); the GRT statement says "to-date".
#   day_weighted - average of the daily value over the bill's usage days. Used for statements that take
#                  effect on the 1st of a month; a bill spanning a change blends the statements by days.
#                  (Inferred from bills: it fits all six, including the three that span a change.)
#
# `scope`: "all" = every plan, or a comma-separated list of plan keys the series applies to.
# `group`: which side of the bill the series belongs to (GRT is applied to each side separately).

[meta]
as_of = 2026-10-07          # statements filed through this date are included
sales_tax_pct = 4.5         # NYC sales tax on everything incl. GRT. Not a Con Ed statement; measured from bills.

